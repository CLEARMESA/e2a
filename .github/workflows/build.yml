name: Build APK via e2a

on:
  workflow_dispatch:
    inputs:
      app_filename:
        description: 'Name of your uploaded .exe or .zip file (e.g. app.exe)'
        required: true
        default: 'app.exe'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential android-sdk aapt zipalign apksigner apktool

      - name: Grant Permissions to Scripts
        run: |
          chmod -R +x .

      - name: Run e2a Conversion
        run: |
          # Detect shell script entry points
          if [ -f "./e2a.sh" ]; then
            ./e2a.sh --input "${{ github.event.inputs.app_filename }}" --output output.apk || ./e2a.sh "${{ github.event.inputs.app_filename }}"
          elif [ -f "./build.sh" ]; then
            ./build.sh "${{ github.event.inputs.app_filename }}"
          else
            echo "Listing files to locate conversion script:"
            ls -la
            echo "Error: Could not locate e2a.sh or build script."
            exit 1
          fi

      - name: Sign APK File
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 || true
          
          APK_FILE=$(find . -maxdepth 3 -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            zipalign -v 4 "$APK_FILE" output_signed.apk || cp "$APK_FILE" output_signed.apk
            apksigner sign --ks debug.keystore --ks-pass pass:android output_signed.apk || true
          else
            echo "Error: No APK file was generated."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-apk
          path: output_signed.apk
