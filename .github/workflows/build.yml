name: Build APK via e2a
on:
  workflow_dispatch:
    inputs:
      app_filename:
        description: 'Name of your uploaded .exe or .zip file (e.g., app.exe or game.zip)'
        required: true
        default: 'app.exe'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool aapt zipalign apksigner wget unzip
      - name: Package EXE into Android APK Container
        run: |
          INPUT_FILE="${{ github.event.inputs.app_filename }}"
          if [ ! -f "$INPUT_FILE" ]; then
            echo "Error: Uploaded file '$INPUT_FILE' not found in repository root."
            echo "Available files in repository:"
            ls -la
            exit 1
          fi
          echo "Downloading WineBOX Base Template..."
          wget -q -O base_container.apk https://github.com/brunodev85/winlator/releases/download/v11.1.0/Winlator_11.1.apk
          if ! unzip -tq base_container.apk > /dev/null 2>&1; then
            echo "Error: downloaded base_container.apk is not a valid APK/zip."
            exit 1
          fi
          echo "Unpacking APK template..."
          apktool d base_container.apk -o apk_structure -f
          mkdir -p apk_structure/assets/app/
          cp "$INPUT_FILE" apk_structure/assets/app/
          apktool b apk_structure -o raw_output.apk
      - name: Sign APK File
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 || true

          TARGET_APK=$(find . -maxdepth 2 -name "*.apk" ! -name "base_container.apk" | head -n 1)
          if [ -n "$TARGET_APK" ]; then
            zipalign -v 4 "$TARGET_APK" output_signed.apk || cp "$TARGET_APK" output_signed.apk
            apksigner sign --ks debug.keystore --ks-pass pass:android output_signed.apk || true
          else
            echo "Error: No output APK could be constructed."
            exit 1
          fi
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-apk
          path: output_signed.apk
