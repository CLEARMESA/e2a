name: Build APK via e2a

on:
  workflow_dispatch:
    inputs:
      app_filename:
        description: 'Name of your uploaded .exe or .zip file (e.g. app.exe)'
        required: true
        default: 'app.exe'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential android-sdk aapt zipalign apksigner

      - name: Build e2a Executable with Cargo
        run: |
          cargo build --release

      - name: Run e2a to Package APK
        run: |
          # Execute the built Rust binary from target/release/
          ./target/release/e2a "${{ github.event.inputs.app_filename }}" -o output.apk || ./target/release/e2a "${{ github.event.inputs.app_filename }}"

      - name: Sign APK File
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 || true
          
          APK_FILE=$(find . -maxdepth 3 -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            zipalign -v 4 "$APK_FILE" output_signed.apk || cp "$APK_FILE" output_signed.apk
            apksigner sign --ks debug.keystore --ks-pass pass:android output_signed.apk || true
          else
            echo "Error: No APK file was generated by e2a."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: converted-apk
          path: output_signed.apk
